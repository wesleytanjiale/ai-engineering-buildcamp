[project]
name = "ai-engineering-buildcamp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dirdotenv>=0.0.3",
    "duckdb>=1.5.2",
    "gitsource>=0.0.4",
    "jaxn>=0.0.5",
    "jupyter>=1.1.1",
    "markitdown[pdf]>=0.1.5",
    "minsearch==0.0.9",
    "openai>=2.32.0",
    "pydantic-ai>=1.89.1",
    "python-dotenv>=1.2.2",
    "toyaikit>=0.0.10",
]

[tool.pytest.ini_options]
pythonpath = ["04-testing/homework"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
